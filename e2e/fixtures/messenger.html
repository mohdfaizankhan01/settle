<!doctype html>
<!-- A Messenger-style layout: rows in [role=main], the user's bubbles on the right, a centred date
     row, timestamps and "Seen". Not a saved real page. -->
<html><head><style>
  body { margin: 0; font: 15px sans-serif; }
  [role=main] { width: 800px; }
  .row { display: flex; padding: 4px 12px; }
  .row.me { justify-content: flex-end; }
  .row.mid { justify-content: center; color: #888; }
  .bubble { max-width: 300px; padding: 8px 12px; border-radius: 16px; background: #eee; }
</style></head><body>
<div role="main">
  <h2>Sam Buyer</h2>
  <div role="grid">
    <div role="row" class="row mid"><span>Today 10:15</span></div>
    <div role="row" class="row"><div class="bubble">Is the lamp available?</div></div>
    <div role="row" class="row me"><div class="bubble">Yes, $40, pick up or I post it</div><span>10:16</span></div>
    <div role="row" class="row"><div class="bubble">Post please<br>to my cousin in Leeds</div></div>
    <div role="row" class="row me"><div class="bubble">Ok</div></div>
    <div role="row" class="row me"><span>Seen</span></div>
  </div>
  <div contenteditable="true" role="textbox" aria-label="Message"></div>
</div>
</body></html>

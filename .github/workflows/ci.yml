# Unit tests and a production build on every push and pull request. PayPal is mocked in the
# tests, so no secrets are needed. The judge-mode, attack and history tests run Settle Link's own
# warning check, which needs the MiniLM model (24 MB), so it is fetched (and cached) before them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the MiniLM model
        uses: actions/cache@v4
        with:
          path: models
          key: minilm-${{ hashFiles('lib/model/embed.ts') }}
      - name: Fetch the MiniLM model
        run: npm run model:fetch
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
